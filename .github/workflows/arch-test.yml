name: arch-test

# PR 에서 아키텍처 규칙(ArchUnit)을 검사한다. 새로 생긴 위반만 실패한다.

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 아키텍처 규칙 검사
        run: ./gradlew archTest --no-daemon
