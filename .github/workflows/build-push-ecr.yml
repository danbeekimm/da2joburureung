name: build-and-push-ecr

# CI: 데모 9개 서비스 이미지를 빌드해 ECR 로 push (EC2 는 pull 만)
# 사전 준비(GitHub 저장소 Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION, AWS_ROLE_ARN, ECR_REGISTRY, ECR_REPO_PREFIX
#   (값은 `terraform output github_actions_vars_hint` 참고)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 로 AWS 자격증명 획득
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - gateway-service
          - user-service
          - product-service
          - order-service
          - company-service
          - delivery-service
          - hub-service
          - hubpath-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO_PREFIX }}/${{ matrix.service }}:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
